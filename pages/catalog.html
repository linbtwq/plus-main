<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plus.plus | Каталог</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    <header class="top-deck">
        <div class="deck-brand">
            <button class="menu-trigger" id="burger-btn" aria-label="Меню" aria-controls="sidebar" aria-expanded="false"><span></span><span></span></button>
            <a href="../index.html" class="brand-text">plus<span>.</span>plus</a>
        </div>
        <div class="deck-user"><span>Каталог 🍿</span></div>
    </header>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="side-logo">plus<span>.</span>plus</div>
        <nav class="side-nav">
            <a href="catalog.html" class="side-link active"><span>🍿</span> Каталог</a>
            <a href="rate.html" class="side-link"><span>💌</span> Оценить</a>
            <a href="list.html" class="side-link"><span>🎞️</span> Архив</a>
            <a href="roulette.html" class="side-link"><span>🎰</span> Слот</a>
        </nav>
        <button id="sidebar-logout" class="side-exit-btn">Выйти</button>
    </aside>

    <main class="archive-container" style="max-width: 1400px;">
        <div class="catalog-header">
            <div>
                <div class="tag-label">TMDB КАТАЛОГ</div>
                <h1 class="scoreboard-title">Что посмотрим? 🍿</h1>
            </div>
        </div>
        <div class="catalog-filters" id="catalog-filters">
            <button class="cat-filter-btn active" data-type="trending">🔥 В тренде</button>
            <button class="cat-filter-btn" data-type="movie">🎬 Фильмы</button>
            <button class="cat-filter-btn" data-type="tv">📺 Сериалы</button>
            <button class="cat-filter-btn" data-type="anime">🍥 Аниме</button>
        </div>
        <div id="catalog-grid" class="catalog-grid"><div class="catalog-loader">ЗАГРУЗКА... ⏳</div></div>
        <div style="text-align: center; margin-top: 40px;">
            <button id="load-more-btn" class="btn-retro" style="max-width: 300px; margin: 0 auto; display: none;">ЗАГРУЗИТЬ ЕЩЕ</button>
        </div>
    </main>

    <nav class="bottom-dock">
        <a href="catalog.html" class="dock-btn active"><i>🍿</i><span>Каталог</span></a>
        <a href="rate.html" class="dock-btn"><i>💌</i><span>Оценка</span></a>
        <a href="list.html" class="dock-btn"><i>🎞️</i><span>Архив</span></a>
        <a href="roulette.html" class="dock-btn"><i>🎰</i><span>Слот</span></a>
    </nav>

    <div id="detail-modal" class="modal-overlay hidden">
        <div class="detail-box">
            <button id="close-detail" class="clear-btn" style="top: 16px; right: 16px; z-index: 30;">✕</button>
            <div id="detail-backdrop" class="detail-backdrop"></div>
            <div class="detail-content">
                <img id="detail-poster" class="detail-poster" src="" alt="">
                <div class="detail-info">
                    <h2 id="detail-title" class="detail-title">Название</h2>
                    <div class="detail-meta">
                        <span id="detail-rating" class="detail-rating">⭐ 8.5</span>
                        <span id="detail-year" class="detail-year">2024</span>
                        <span id="detail-runtime" class="detail-runtime">120 мин</span>
                    </div>
                    <div id="detail-genres" class="detail-genres">Жанры</div>
                    <p id="detail-overview" class="detail-overview">Описание...</p>
                    <div class="detail-actions">
                        <button id="detail-play-btn" class="btn-retro" style="flex: 1;">▶ ТРЕЙЛЕР</button>
                        <button id="detail-add-btn" class="btn-retro pine" style="flex: 1;">🎰 В РУЛЕТКУ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="trailer-modal" class="modal-overlay hidden">
        <div class="trailer-box">
            <button id="close-trailer" class="clear-btn" style="top: -15px; right: -15px; z-index: 20;">✕</button>
            <iframe id="trailer-iframe" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
    <div id="toast" class="toast hidden">Добавлено!</div>

    <script src="../assets/js/snow.js"></script>
    <script src="../assets/js/burger.js"></script>
    <script type="module" src="../assets/js/catalog.js"></script>
</body>
</html>
